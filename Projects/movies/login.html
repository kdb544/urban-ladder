<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="./js/login.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="login-container">
        
        <div class="login-form">
            <h1 class="h">Sign In</h1>

        <form id="loginForm" action="/login" method="POST">
            <input type="text" id="username" name="username" required placeholder="Enter Username" class="user_name"><br><br>
            <input type="password" id="password" name="password" required placeholder="Enter Password" class="password"><br><br>
            <input type="submit" value="Login" class="login-button">

            <input type="checkbox" id="rememberMe" name="rememberMe">
            <label for="rememberMe" class="check">Remember Me</label><br><br>
            <input type="button" value="Forgot Password" onclick="window.location.href='/forgot-password'" class="forgot-password-button">
            <span>New to ZMDB? :</span><input type="button" value=" Sign Up" onclick="window.location.href='/signup'" class="signup-button">
        </form>
        </div>
    </div>
</body>
</html>
