<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/cards.css">
    <link rel="stylesheet" href="./css/movieDetail.css">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Movie Details</title>
</head>
<body class="movie-detail-page">

    <nav class="navbar navbar-expand-lg" style="background-color: rgba(255, 255, 255, 0.85);">
        <div class="container-fluid">

            <a class="navbar-brand" href="./movie.html">ZMDB</a>

            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <!-- SEARCH -->
                <form class="movie-search" id="searchForm">

                    <input type="text" id="searchInput" placeholder="Search for a movie...">

                    <button type="submit"> Search </button>
                </form>


                <!-- NAVIGATION -->
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="./movie.html"> Home </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">  Movies  </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">  Actors  </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <section id="searchResults" class="results"></section>

    <div class="movie-detail-container" id="movieContainer">
        <!-- Movie details will be dynamically inserted here -->
    </div>

    <script src="./js/api.js" defer></script>
    <script src="./js/search.js" defer></script>
    <script src="./js/movieDetail.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
