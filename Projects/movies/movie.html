<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/cards.css">
    <link rel="stylesheet" href="./css/movie.css">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="./js/api.js" defer></script>
    <script src="./js/search.js" defer></script>
    <script src="./js/movie.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Applications</title>
</head>
<body class="page">
    <nav class="navbar navbar-expand-lg" style="background-color: rgba(255, 255, 255, 0.85);">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">ZMDB</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" >
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Movies</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Actors</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="hero">

        <div class="hero-content">

            <h1>Welcome.</h1>
            <p>Millions of movies, TV shows and people to discover.</p>

            <form id="searchForm">
            
                <input type="text" id="searchInput" placeholder="Search for a movie..." class="search-bar">
                <input type="submit" value="submit" class="submit-button">
            
            </form>

        </div>

    </main>

    <section id="searchResults" class="results"></section>

    <section id="rows" class="rows"></section>

    <footer class="tmdb-credit">
        <p>This product uses the <a href="https://www.themoviedb.org/" target="_blank">TMDB</a> API but is not endorsed or certified by TMDB.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
