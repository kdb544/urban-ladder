<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./CSS/ToDo-list.css">    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="./JS/ToDo-list.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>
<body>
    <div>
        <h1 class="head"> TO DO LIST</h1>
        <div class="box">
            <!-- //Left Side// -->
            <div class="left">
            <h2 class="sub_head">Create Tasks</h2>
            <input type="text" id="inputTask" placeholder="What needs to be done?" class="textBox">
            <button id="addTask" class="addButton">Add</button>
            <h2 class="sub_head">My Tasks</h2>
            <ul class="list">
            </ul>
            </div>
            <!-- //Right Side// -->
            <div class="right">
                <section class="notes">
                    <h2 class="sub_head">Notes</h2>
                    <textarea placeholder="Write your notes..."></textarea>
                </section>
                <section class="focus">
                    <h2 class="sub_head">Focus</h2>
                    <textarea placeholder="What are you focusing on?"></textarea>
                </section>
                <section class="remember">
                    <h2 class="remSub_head" >Remember</h2>
                    <textarea  placeholder="Don't Forget..."class="remInput"></textarea>
                </section>
            </div>
        </div>
    </div>
</body>
</html>
