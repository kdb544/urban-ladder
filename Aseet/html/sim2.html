<!DOCTYPE html>
<html lang="en">
<head>
        <style>

            table {
                height: 250px;
                width: 700px;
                border-collapse: collapse;
                margin: auto;
                   }

             td {
                border: 1px dashed black;
                text-align: center;
                }
              




            
        </style>
</head>
<body>
<table>
    <thead>
        <tr>
            <td colspan="3">Header</td>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td rowspan="3">Sidebar</td>
            <td>Item A</td>
            <td>Item B</td>
        </tr>
        <tr>
            <td rowspan="2">Main Content</td>
            <td>item C</td>
        </tr>
        <tr>
            <td>Item D</td>
        </tr>
    </tbody>
    <tfoot>
    <tr>
            <td colspan="3"> Footer</td>
    </tr>
    </tfoot>

</table>
</body>
</html>
